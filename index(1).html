<style>
html,body{margin:0;background:#fff;}
@media (prefers-color-scheme: dark){ html,body{background:#0f1115;} }
#app{max-width:520px;margin:0 auto;}
#app > .sa{min-height:100vh;}

/* ===== The customer app (this part is copied into the downloaded app file) ===== */
.sa{--a:#0f766e;--a-soft:#e6f2f0;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--bg:#fff;--soft-bg:#f6f7f9;--on-a:#fff;--hero:#0f766e;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Telugu",sans-serif;
  color:var(--ink);background:var(--bg);min-height:100%;display:flex;flex-direction:column;font-size:17px;line-height:1.5;}
.sa *{box-sizing:border-box;}
.sa .sa-label{background:#f3f4f6;color:#4b5563;font-size:.72rem;text-align:center;padding:6px 12px;border-bottom:1px solid var(--line);}
.sa .sa-dots{display:flex;gap:6px;justify-content:center;padding:14px 0 4px;}
.sa .sa-dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block;}
.sa .sa-dots i.on{background:var(--a);}
.sa .sa-body{flex:1;padding:18px 22px 26px;display:flex;flex-direction:column;}
.sa .sa-kicker{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--a);margin:6px 0 8px;}
.sa h1{font-size:1.55rem;line-height:1.25;margin:0 0 12px;letter-spacing:-.01em;}
.sa h2{font-size:1.25rem;line-height:1.3;margin:0 0 10px;}
.sa p{margin:0 0 12px;}
.sa .sa-muted{color:var(--muted);font-size:.92rem;}
.sa .sa-empty{color:#9ca3af;font-style:italic;}
.sa .sa-spacer{flex:1;min-height:16px;}
.sa .sa-btn{display:block;width:100%;border:none;border-radius:14px;background:var(--a);color:var(--on-a);font-size:1.05rem;font-weight:600;min-height:54px;
  padding:15px 18px;cursor:pointer;font-family:inherit;margin-top:10px;text-align:center;}
.sa .sa-btn:disabled{opacity:.45;cursor:default;}
.sa .sa-btn.ghost{background:var(--bg);color:var(--a);border:2px solid var(--a);}
.sa .sa-btn:focus-visible{outline:3px solid #93c5fd;outline-offset:2px;}
.sa .sa-card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px;}
.sa .sa-card .sa-ex{color:var(--muted);font-size:.88rem;margin:4px 0 10px;}
.sa .sa-two{display:flex;gap:8px;}
.sa .sa-pick{flex:1;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 10px;min-height:52px;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:8px;text-align:left;font-family:inherit;cursor:pointer;color:var(--ink);}
.sa .sa-pick.sel{border-color:var(--a);background:var(--a-soft);color:var(--a);font-weight:600;}
.sa .sa-big{font-size:2.6rem;font-weight:700;color:var(--a);line-height:1;margin:6px 0 10px;}
.sa .sa-trust{border-left:5px solid var(--a);background:var(--a-soft);padding:16px 18px;border-radius:0 12px 12px 0;font-size:1.15rem;font-weight:600;margin:6px 0 14px;}
.sa .sa-steps{margin:0 0 12px;padding-left:22px;}
.sa .sa-steps li{margin-bottom:6px;}
.sa .sa-meter{height:12px;border-radius:6px;background:var(--soft-bg);overflow:hidden;margin:8px 0 4px;}
.sa .sa-meter span{display:block;height:100%;width:0;background:var(--a);transition:width .08s linear;}
.sa .sa-status{font-weight:600;margin:8px 0;min-height:1.5em;}
.sa .sa-try{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:.95rem;}
.sa .sa-try b{width:52px;flex:none;}
.sa .sa-try .sa-bar{flex:1;height:14px;background:var(--soft-bg);border-radius:7px;overflow:hidden;}
.sa .sa-try .sa-bar span{display:block;height:100%;background:var(--a);}
.sa .sa-try em{width:64px;text-align:right;font-style:normal;flex:none;}
.sa .sa-note{font-size:.8rem;color:var(--muted);margin-top:8px;}
.sa .sa-foot{font-size:.72rem;color:#9ca3af;text-align:center;padding:10px 12px 16px;}
/* Room scan (step 1) */
.sa .sa-chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px;}
.sa .sa-chips .sa-pick{flex:1 1 45%;}
.sa .sa-pick:disabled{opacity:.5;cursor:default;}
.sa .sa-rank{margin:6px 0 4px;}
.sa .sa-rank-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.95rem;}
.sa .sa-rank-row b{width:22px;flex:none;color:var(--a);}
.sa .sa-rank-row .sa-rank-name{width:42%;flex:none;}
.sa .sa-rank-row .sa-bar{flex:1;height:14px;background:var(--soft-bg);border-radius:7px;overflow:hidden;}
.sa .sa-rank-row .sa-bar span{display:block;height:100%;background:var(--a);}
.sa .sa-types{list-style:none;margin:-4px 0 10px 32px;padding:0;font-size:.82rem;color:var(--muted);}
.sa .sa-types li{position:relative;padding-left:14px;margin:2px 0;}
.sa .sa-types li:before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--a);}
.sa .sa-rec{border-left:5px solid var(--a);background:var(--a-soft);padding:12px 16px;border-radius:0 12px 12px 0;margin:4px 0 16px;}
.sa .sa-rec .sa-kicker{margin:0 0 4px;}
.sa .sa-rec-line{font-size:1.1rem;font-weight:600;}
.sa .sa-rec .sa-muted{margin:6px 0 0;}
.sa .sa-lesson{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:0 0 16px;}
.sa .sa-lesson .sa-kicker{margin:0 0 4px;}
.sa .sa-lesson p{margin:0;font-size:.95rem;}
.sa .sa-langs{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;margin:0 0 14px;}
.sa .sa-lang{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:.85rem;font-family:inherit;cursor:pointer;color:var(--ink);}
.sa .sa-lang.sel{border-color:var(--a);background:var(--a-soft);color:var(--a);font-weight:600;}
.sa .sa-listen{border:1px solid var(--a);background:var(--bg);color:var(--a);border-radius:999px;padding:2px 10px;font-size:.78rem;font-family:inherit;cursor:pointer;margin-top:4px;}
.sa .sa-btn.sa-small{padding:9px 12px;font-size:.92rem;margin-top:10px;min-height:44px;}
.sa .sa-rec-fix{margin:8px 0 0;font-weight:600;font-size:.95rem;}
.sa .sa-steady{font-size:.9rem;margin:0 0 14px;color:var(--muted);}
.sa .sa-steady.sa-warn{color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;}
.sa .sa-types.sa-types-flush{margin:8px 0 0;}
.sa .sa-list{margin:4px 0 0;padding-left:20px;font-size:.95rem;}
.sa .sa-list li{margin:4px 0;}
.sa .sa-sub{font-weight:700;font-size:.9rem;margin:12px 0 2px;}
.sa .sa-strong{font-weight:600;}
.sa .sa-play2{display:flex;gap:8px;margin-top:8px;}
.sa .sa-play2 .sa-btn{flex:1;margin-top:0;}
.sa .sa-link{background:none;border:none;color:var(--a);text-decoration:underline;font-family:inherit;font-size:.9rem;padding:8px 0 0;cursor:pointer;}
.sa .sa-lesson .sa-status{min-height:1.2em;margin:6px 0 0;font-size:.95rem;}
.sa .sa-facing{font-size:.8rem;color:var(--muted);}
.sa .sa-rank-tag{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}

/* ===== Round 4: layout and look ===== */
/* Three named stages */
.sa .sa-stagebar{display:flex;gap:8px;padding:12px 22px 0;}
.sa .sa-stage{flex:1;font-size:.72rem;font-weight:600;color:var(--muted);}
.sa .sa-stage i{display:block;height:5px;border-radius:3px;background:var(--line);margin-bottom:5px;transition:background .3s;}
.sa .sa-stage.on i{background:var(--a);}
.sa .sa-stage.now span{color:var(--a);}
/* Slide-in when the screen changes */
.sa .sa-enter{animation:saIn .28s ease-out;}
@keyframes saIn{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:none;}}
/* Main buttons stay under the thumb */
.sa .sa-actions{position:sticky;bottom:0;z-index:5;background:var(--bg);margin:10px -22px -26px;padding:10px 22px 14px;box-shadow:0 -8px 14px -10px rgba(0,0,0,.25);}
.sa .sa-actions .sa-btn:first-child{margin-top:0;}
/* Bold opening */
.sa .sa-hero{flex:1;display:flex;flex-direction:column;text-align:center;}
.sa .sa-hero h1{font-size:1.75rem;margin:0 0 10px;}
.sa .sa-hero .sa-sub-hero{color:var(--muted);margin:0 auto;max-width:30em;}
.sa .sa-hero .sa-langs{justify-content:center;margin:0 0 6px;}
.sa .sa-hero-art{display:block;width:220px;max-width:70%;height:auto;margin:auto auto 22px;color:var(--a);}
.sa .sa-hero-art .w1,.sa .sa-hero-art .w2,.sa .sa-hero-art .w3{animation:saPulse 2.4s ease-in-out infinite;}
.sa .sa-hero-art .w2{animation-delay:.3s;} .sa .sa-hero-art .w3{animation-delay:.6s;}
@keyframes saPulse{0%,100%{opacity:.15;}50%{opacity:.75;}}
.sa .sa-next-art{display:flex;gap:14px;color:var(--a);margin:8px 0 18px;}
.sa .sa-next-art .sa-ico{width:34px;height:34px;padding:7px;border-radius:12px;background:var(--a-soft);box-sizing:content-box;}
/* Icons */
.sa .sa-ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.sa .sa-card-head{display:flex;gap:10px;align-items:flex-start;}
.sa .sa-card-ico{width:24px;height:24px;color:var(--a);margin-top:1px;}
.sa .sa-card .sa-ex{margin-left:34px;}
.sa .sa-types.ic li{padding-left:0;display:flex;gap:6px;align-items:flex-start;}
.sa .sa-types.ic li:before{display:none;}
.sa .sa-types.ic .sa-ico{width:16px;height:16px;color:var(--a);margin-top:2px;}
.sa .sa-voice-step{display:flex;gap:8px;align-items:flex-start;font-weight:600;margin:8px 0 0;}
.sa .sa-voice-step .sa-ico{color:var(--a);margin-top:2px;}
/* Live sound: moving bars and a countdown ring */
.sa .sa-viz{display:flex;align-items:center;gap:12px;margin:12px 0 2px;}
.sa .sa-viz canvas{flex:1;min-width:0;width:100%;height:56px;background:var(--soft-bg);border-radius:12px;}
.sa .sa-ring{width:56px;height:56px;flex:none;}
.sa .sa-ring .bg{stroke:var(--line);} .sa .sa-ring .fg{stroke:var(--a);}
.sa .sa-ring text{fill:var(--ink);font-size:17px;font-weight:700;font-family:inherit;}
/* Clap ripple */
.sa .sa-ripple{position:relative;height:130px;display:flex;align-items:center;justify-content:center;margin:4px 0;overflow:hidden;}
.sa .sa-ripple .core{position:relative;width:52px;height:52px;border-radius:50%;background:var(--a);color:var(--on-a);display:flex;align-items:center;justify-content:center;}
.sa .sa-ripple .core .sa-ico{width:26px;height:26px;}
.sa .sa-ripple span{position:absolute;width:52px;height:52px;border-radius:50%;border:3px solid var(--a);opacity:0;}
.sa .sa-ripple.go span{animation:saRip 1.5s ease-out forwards;}
.sa .sa-ripple.go span:nth-child(2){animation-delay:.22s;} .sa .sa-ripple.go span:nth-child(3){animation-delay:.44s;}
@keyframes saRip{0%{transform:scale(1);opacity:.85;}100%{transform:scale(4.6);opacity:0;}}
/* Good-news tick */
.sa .sa-tickline{display:flex;align-items:center;gap:6px;}
.sa .sa-tick{width:20px;height:20px;color:#16a34a;stroke-width:3;}
.sa .sa-tick path{stroke-dasharray:24;stroke-dashoffset:24;animation:saTick .5s .15s ease-out forwards;}
@keyframes saTick{to{stroke-dashoffset:0;}}
.sa .sa-done{display:flex;justify-content:center;margin:24px 0 8px;}
.sa .sa-done .sa-tick{width:72px;height:72px;padding:14px;border-radius:50%;background:var(--a-soft);color:var(--a);box-sizing:content-box;}
/* Result tabs */
.sa .sa-tabs{display:flex;gap:4px;position:sticky;top:0;z-index:6;background:var(--bg);margin:0 -22px 14px;padding:8px 22px;border-bottom:1px solid var(--line);overflow-x:auto;}
.sa .sa-tab{flex:1;white-space:nowrap;border:none;background:none;font-family:inherit;font-size:.9rem;font-weight:600;color:var(--muted);padding:9px 8px;border-radius:10px;cursor:pointer;min-height:40px;}
.sa .sa-tab.sel{background:var(--a-soft);color:var(--a);}
/* Room map */
.sa .sa-map{margin:0 0 16px;}
.sa .sa-map svg{display:block;width:100%;height:auto;max-height:62vh;}
.sa .sa-map .sa-note{margin-top:4px;}
.sa .sa-history li{margin:8px 0;}
/* Dark mode, following the phone's setting */
.sa.sa-dark{--ink:#e5e7eb;--muted:#9ca3af;--line:#2d3340;--bg:#0f1115;--soft-bg:#1a1e26;}
.sa.sa-dark .sa-label{background:#1a1e26;color:#9ca3af;}
.sa.sa-dark .sa-steady.sa-warn{background:#2a2110;border-color:#5c4511;color:#fcd34d;}
.sa.sa-dark .sa-empty{color:#6b7280;}
.sa.sa-dark .sa-actions{box-shadow:0 -8px 14px -10px rgba(0,0,0,.8);}
.sa.sa-dark .sa-tick{color:#4ade80;}
/* Respect "reduce motion" */
@media (prefers-reduced-motion: reduce){
  .sa *{animation:none !important;transition:none !important;}
  .sa .sa-tick path{stroke-dashoffset:0;}
}

/* ===== Round 5: calmer layout ===== */
.sa .sa-stage.now{flex:2.2;}
.sa .sa-lesson{border:none;border-top:1px solid var(--line);border-radius:0;padding:14px 0 4px;margin:4px 0 8px;}
.sa .sa-actions{padding:8px 22px 10px;}
.sa .sa-links{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 22px;margin-top:4px;}
.sa .sa-links .sa-link{padding:8px 4px;min-height:40px;}
.sa .sa-link{background:none;border:none;color:var(--a);text-decoration:underline;text-underline-offset:3px;font-family:inherit;font-size:.92rem;cursor:pointer;padding:6px 0;}
.sa .sa-where{display:inline-flex;gap:8px;align-items:center;align-self:flex-start;font-weight:600;font-size:.92rem;color:var(--a);background:var(--a-soft);border-radius:999px;padding:6px 14px;margin:0 0 14px;}
.sa .sa-center{text-align:center;}
.sa .sa-center-row{display:flex;justify-content:center;}
.sa .sa-center-row .sa-where{align-self:center;}
.sa .sa-oneline{color:var(--muted);margin:0 0 6px;}
.sa .sa-chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px;}
.sa .sa-chips .sa-pick{min-height:64px;justify-content:flex-start;padding:10px 12px;}
.sa .sa-chips .sa-pick:last-child:nth-child(odd){grid-column:1 / -1;}
.sa .sa-chips .sa-pick .sa-ico{width:22px;height:22px;color:var(--a);}
.sa .sa-spotdots{display:flex;gap:10px;justify-content:center;margin:6px 0 16px;}
.sa .sa-spotdots span{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:var(--muted);}
.sa .sa-spotdots span.done{background:var(--a);border-color:var(--a);color:var(--on-a);}
.sa .sa-done.sa-done-sm{margin:18px 0 6px;}
.sa .sa-done.sa-done-sm .sa-tick{width:48px;height:48px;padding:12px;}
.sa .sa-viz.big{flex-direction:column;gap:14px;margin:18px 0 6px;}
.sa .sa-viz.big .sa-ring{width:132px;height:132px;order:-1;}
.sa .sa-viz.big .sa-ring text{font-size:14px;}
.sa .sa-viz.big canvas{height:64px;}
.sa .sa-about{margin:10px 0 4px;font-size:.88rem;color:var(--muted);}
.sa .sa-about summary{cursor:pointer;color:var(--a);font-weight:600;padding:6px 0;list-style:none;}
.sa .sa-about summary::-webkit-details-marker{display:none;}
.sa .sa-about summary:before{content:"ⓘ";margin-right:6px;}
.sa .sa-about.sa-how summary:before{content:"?";margin-right:6px;}
.sa .sa-about .sa-list,.sa .sa-about .sa-steps{margin-top:4px;}
.sa button.sa-rank-row{width:100%;border:none;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;padding:6px 0;margin:4px 0;}
.sa .sa-rank-row .sa-rank-name{width:46%;}
.sa .sa-rank-row .sa-rank-tag{text-transform:none;letter-spacing:0;font-weight:600;}
.sa .sa-chev{width:14px;flex:none;color:var(--muted);font-size:1.2rem;line-height:1;transition:transform .2s;}
.sa .sa-rank-row.open .sa-chev{transform:rotate(90deg);}
.sa .sa-rank-more{margin:-2px 0 10px 32px;font-size:.88rem;}
.sa .sa-rank-more .sa-types{margin:4px 0;}
.sa .sa-tabs{margin-top:-6px;}
.sa .sa-hero-text{margin-bottom:auto;}

/* ===== Round 6: language screen and light/dark toggle ===== */
.sa .sa-topbar{display:flex;align-items:center;gap:10px;padding:10px 14px 0 22px;}
.sa .sa-topbar .sa-stagebar{flex:1;padding:0;}
.sa .sa-theme{width:32px;height:32px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.sa .sa-theme .sa-ico{width:17px;height:17px;}
.sa .sa-theme:focus-visible{outline:3px solid #93c5fd;outline-offset:2px;}
.sa .sa-langpage{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;}
.sa .sa-langbadge{align-self:center;font-size:1.3rem;font-weight:700;color:var(--a);background:var(--a-soft);border-radius:999px;padding:12px 20px;margin:0 0 18px;letter-spacing:.08em;}
.sa .sa-langhead{display:flex;flex-direction:column;gap:2px;font-size:1.45rem;margin:0 0 22px;}
.sa .sa-langhead .sa-langalt{font-size:1rem;font-weight:600;color:var(--muted);}
.sa .sa-langlist{display:flex;flex-direction:column;gap:10px;}
.sa .sa-langpick{justify-content:space-between;min-height:58px;padding:12px 18px;flex:none;}
.sa .sa-langpick .sa-langname{font-size:1.15rem;font-weight:600;}
.sa .sa-langpick .sa-langen{font-size:.85rem;color:var(--muted);}
.sa .sa-langpick.sel .sa-langen{color:var(--a);}

/* ===== Round 7: logo, intro, fades, microphone help, polish ===== */
/* Fade between screens (replaces the slide) */
.sa .sa-enter{animation:saFadeIn .32s ease-out;}
.sa .sa-leave{animation:saFadeOut .2s ease-in forwards;}
@keyframes saFadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes saFadeOut{from{opacity:1;}to{opacity:0;}}
/* Logo */
.sa .sa-logo{display:inline-flex;align-items:center;color:var(--a);}
.sa .sa-logo-mark{display:flex;}
.sa .sa-logo-mark svg{width:40px;height:40px;}
.sa .sa-logo-word{font-size:1.45rem;color:var(--ink);white-space:nowrap;letter-spacing:-.01em;margin-left:10px;line-height:1;}
.sa .sa-logo-word b{color:var(--a);font-weight:800;}
.sa .sa-logo.big .sa-logo-mark svg{width:76px;height:76px;}
.sa .sa-logo.big .sa-logo-word{font-size:2.05rem;}
/* Intro animation */
.sa .sa-intro{flex:1;display:flex;align-items:center;justify-content:center;border:none;background:none;cursor:pointer;padding:0;font:inherit;color:inherit;min-height:60vh;}
.sa .sa-intro .sa-logo-mark{opacity:0;}
.sa .sa-intro .sa-logo.show .sa-logo-mark{animation:saBreathe 1.45s ease-in-out forwards;}
@keyframes saBreathe{0%{opacity:0;transform:scale(.82);}35%{opacity:1;transform:scale(1);}62%{opacity:.3;transform:scale(.96);}88%,100%{opacity:1;transform:scale(1);}}
.sa .sa-intro .sa-logo-word{max-width:0;opacity:0;overflow:hidden;margin-left:0;transition:max-width .85s cubic-bezier(.2,.7,.2,1),opacity .55s ease .3s,margin-left .85s cubic-bezier(.2,.7,.2,1);}
.sa .sa-intro .sa-logo.reveal .sa-logo-word{max-width:320px;opacity:1;margin-left:14px;}
.sa .sa-intro:focus-visible{outline:none;}
/* Microphone heads-up and help */
.sa .sa-micbadge{align-self:center;width:84px;height:84px;border-radius:50%;background:var(--a-soft);color:var(--a);display:flex;align-items:center;justify-content:center;margin:18px 0 16px;}
.sa .sa-micbadge .sa-ico{width:38px;height:38px;}
.sa .sa-micbadge.sa-micoff{background:var(--soft-bg);color:var(--muted);}
/* Sentence case for small headings (6) */
.sa .sa-kicker,.sa .sa-rank-tag{text-transform:none;letter-spacing:0;}
.sa .sa-kicker{font-size:.82rem;}
/* Accessibility (8): visible focus, comfortable tap sizes, readable footer */
.sa button:focus-visible,.sa summary:focus-visible{outline:3px solid #60a5fa;outline-offset:2px;border-radius:8px;}
.sa .sa-links .sa-link,.sa .sa-link{min-height:44px;}
.sa .sa-theme{position:relative;}
.sa .sa-theme:after{content:"";position:absolute;inset:-6px;}
.sa .sa-about summary{min-height:44px;display:flex;align-items:center;}
.sa .sa-foot{color:var(--muted);line-height:1.6;}
.sa .sa-label{color:#4b5563;}
.sa.sa-dark .sa-label{color:#a3aab6;}

/* ===== Round 8: tap to begin, map fill-in, reveal, bigger result icons ===== */
.sa .sa-intro{flex-direction:column;gap:22px;}
.sa .sa-pop{animation:saPop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center;}
@keyframes saPop{from{opacity:0;transform:scale(.3);}to{opacity:1;transform:scale(1);}}
.sa .sa-ringin{animation:saRingIn .65s ease-out both;transform-box:fill-box;transform-origin:center;}
@keyframes saRingIn{from{opacity:0;transform:scale(1.9);}to{opacity:1;transform:scale(1);}}
.sa .sa-map.mini{max-width:250px;margin:6px auto 8px;}
.sa .sa-types.big{font-size:.95rem;}
.sa .sa-types.big li{align-items:center;gap:10px;margin:6px 0;}
.sa .sa-types.big .sa-ico{width:30px;height:30px;padding:6px;border-radius:50%;background:var(--bg);margin:0;box-sizing:border-box;}

/* ===== Round 9: microphone pop-up ===== */
.sa .sa-modal-back{position:fixed;inset:0;z-index:50;background:rgba(15,17,21,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:saFadeIn .2s ease-out;}
.sa .sa-modal{width:100%;max-width:440px;background:var(--bg);color:var(--ink);border-radius:20px;padding:8px 20px 16px;display:flex;flex-direction:column;max-height:90vh;overflow:auto;}
@media (min-width:600px){ .sa .sa-modal-back{align-items:center;} }
.sa .sa-modal h2{margin:4px 0 8px;}
.sa .sa-modal p{color:var(--ink);}
.sa .sa-modal .sa-micbadge{width:64px;height:64px;margin:12px 0 10px;}
.sa .sa-modal .sa-micbadge .sa-ico{width:30px;height:30px;}
.sa .sa-modal-actions{margin-top:6px;}
.sa .sa-modal-actions .sa-btn{margin-top:4px;}

<script>

/* ===== The customer app (this part is copied into the downloaded app file) ===== */
var SA_COLORS = {teal:['#0f766e','#e6f2f0'], indigo:['#3d5a80','#e8eef6'], maroon:['#9f1239','#fdecef'], green:['#15803d','#e9f7ee'], saffron:['#c2410c','#fff1e6']};
var SA_LABEL = {
  none:'Student-built app · research prototype · not an offer from any company.',
  a2v:'Student-built app for A2V Consulting Group · research prototype · not an offer or a quote.',
  plum:'Student-built app for Plum AV · research prototype · not an offer or a quote.',
  both:'Student-built app for A2V Consulting Group and Plum AV · research prototype · not an offer or a quote.'
};

function renderApp(root, c, opts) {
  opts = opts || {};
  var preview = !!opts.preview;
  var col = SA_COLORS[c.color] || SA_COLORS.teal;
  var answers = {};
  var screen = 0;
  var stopClap = null;
  var spots = [];        // room scan, this session only: [{base, num, facing, level, ..., echo, clip}]; levels are never shown as numbers
  var spotName = '';
  var spotFacing = '';
  var mode = null;       // a step in progress on the scan screen: {kind: 'fix' | 'steady' | 'clap', target, after}
  var steady = null;     // result of the steady-readings check: {ok: true|false}
  var fixDone = false;   // once anyone tries a fix, the steady check is no longer fair
  var voice = {step: 0, best: null, worst: null};   // Hear the difference: two 5-second voice clips, memory only
  var savedThis = false; // this scan saved on the phone (opt-in, for comparing times of day)
  var openCard = null;   // result card shown over the result screen: spot | hear | keep | fixes

  var proAsked = false;  // "I'd like professional help" was tapped (step 1 placeholder)
  var confirmRestart = false; // "Start again?" confirmation is showing
  var soundPending = false;   // intro sound was blocked: play it on the language tap
  var scanStep = 'where';
  var sketchItems = [];  // the optional room sketch: [{type, x, y, wall?}]
  var sketchPick = null; // item chosen in the tray, waiting for a tap on the room

  var lastName = null;   // for the slide-in when the screen changes
  var lang = 'en';
  var theme = null;      // null = follow the phone; 'light' or 'dark' once the person taps the toggle (this visit only)
  var micReady = false;  // the person has seen the microphone heads-up and allowed it

  var MAX_SPOTS = 5, MIN_SPOTS = 3;
  var echoOn = !!(c.clap && c.clap.on);
  var STORE = 'soundcheck-scans-v1';

  // Translation: English text is the key; anything without a translation stays in English.
  function T(s, vars) {
    var d = (lang !== 'en' && window.SA_I18N && SA_I18N[lang]) || null;
    var out = (d && d[s]) || s;
    if (vars) Object.keys(vars).forEach(function (k) { out = out.split('{' + k + '}').join(vars[k]); });
    return out;
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function val(path) { var o = c; path.split('.').forEach(function (k) { o = (o == null) ? null : o[k]; }); return (o == null) ? '' : String(o).trim(); }
  // Text from a box: real text, or (in the preview only) a gray placeholder. Returns null when it should be left out.
  function txt(tag, cls, path, placeholder) {
    var v = val(path);
    if (v) return el(tag, cls, T(v));

    return null;
  }
  function add(parent, child) { if (child) parent.appendChild(child); return child; }
  function items() {
    var list = (c.notice && c.notice.items) || [];

    if (!out.length && preview) out = [{i: 0, text: '[Sign 1]', example: '', empty: true}, {i: 1, text: '[Sign 2]', example: '', empty: true}];

  }

    goName('lang');
  }
  function askRestart() {
    var started = spots.length || Object.keys(answers).length;
    if (!started) { restart(); return; }

    confirmRestart = true; draw();

    m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', 'sa-restart-title');
    var ic = el('div', 'sa-micbadge'); ic.appendChild(saIcon('restart')); m.appendChild(ic);
    var h = el('h2', 'sa-center', T('Start again?')); h.id = 'sa-restart-title'; m.appendChild(h);
    m.appendChild(el('p', 'sa-center', T('Your answers and scan so far will be cleared.')));

    link(links, T('Cancel'), function () { confirmRestart = false; draw(); });
    box.appendChild(links); m.appendChild(box); back.appendChild(m);
    setTimeout(function () { var f = m.querySelector('button'); if (f) f.focus(); }, 30);
    return back;
  }
  function micProblem(kind) {   // open the pop-up; for "blocked", first ask the browser whether it can still ask the person

    }
    draw();
  }
  function askMic(then) {   // the browser's own permission prompt, from a tap

  }
  function device() {

  function addressBar(dev) {

      var a = trace[i - 1], z = trace[i];
      var frac = (a[1] - target) / ((a[1] - z[1]) || 1);
      var tCross = a[0] + frac * (z[0] - a[0]) - peakT;
      return {secs: Math.max(0.01, tCross * 20 / drop), over: false};
    }
  }
  return {secs: 1.5, over: true};
}

renderApp(document.getElementById("app"), CONTENT, {preview: false});
</script>
